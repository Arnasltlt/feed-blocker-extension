<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Curated Feed</title>
  <link rel="stylesheet" href="feed.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <h1>Focus Feed</h1>
        <p class="subtitle">Your news, on your terms.</p>
      </div>
      <div class="actions">
        <button id="summarize-btn" class="primary-btn">Summarize My Feed</button>
        <button id="load-mock-btn" class="secondary-btn">Load Mock Data</button>
        <button id="clear-history-btn" class="danger-btn">Clear History</button>
      </div>
    </header>

    <main class="feed-content">
      <section id="summary-section" class="summary-section hidden">
        <div class="summary-header">
          <h2>Talk of the Town</h2>
        </div>
        <div id="summary-topics" class="summary-topics">
          <!-- Topic cards will be injected here -->
        </div>
      </section>

      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">🌱</div>
        <h2>No recommendations yet</h2>
        <p>Visit blocked sites to collect feeds, or load mock data to see how it looks.</p>
      </div>

      <div class="feed-grid" id="feed-grid">
        <!-- Sections will be injected here -->
      </div>
    </main>
  </div>

  <script src="feed.js"></script>
</body>
</html>
